[build]
  command = "npm run build"
  publish = ".next"

[functions]
  directory = "netlify/functions"

[functions."cron-pickup-reminders"]
  schedule = "0 12 * * *"

[functions."cron-balance-reminders"]
  schedule = "0 13 * * *"

[functions."cron-note-emails"]
  schedule = "*/15 * * * *"

[[plugins]]
  package = "@netlify/plugin-nextjs"
