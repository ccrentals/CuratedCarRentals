[build]
  command = "npm run build"
  publish = ".next"

[context.production]
  command = "npm run migrate && npm run build"

[context.deploy-preview]
  command = "npm run build"

[context.staging]
  command = "npm run db:bootstrap && npm run migrate && npm run build"

[context.branch-deploy]
  command = "npm run build"

[functions]
  directory = "netlify/functions"

[functions."cron-pickup-reminders"]
  schedule = "0 12 * * *"

[functions."cron-balance-reminders"]
  schedule = "0 13 * * *"

[functions."cron-note-emails"]
  schedule = "*/15 * * * *"

[functions."cron-maintenance-reminders"]
  schedule = "0 14 * * *"

[functions."cron-archive-cancelled-bookings"]
  schedule = "30 5 * * *"

[functions."cron-archive-file-cleanup"]
  schedule = "0 5 * * *"

[[plugins]]
  package = "@netlify/plugin-nextjs"
